<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自己紹介 | Kankimo Website</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #db7093;
        background: #ffc0cb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      main {
        width: min(100%, 760px);
        background: #ffe4e1;
        border: 2px solid #db7093;
        border-radius: 24px;
        box-shadow: 0 16px 40px rgba(219, 112, 147, 0.18);
        padding: clamp(28px, 6vw, 56px);
      }

      .profile {
        display: grid;
        gap: 28px;
        align-items: center;
      }

      .profile-image {
        width: 160px;
        aspect-ratio: 1;
        border-radius: 50%;
        display: grid;
        place-items: center;
        justify-self: center;
        overflow: hidden;
        background: linear-gradient(135deg, #e8f1f8, #f7e7dc);
        border: 4px solid #ffe4e1;
        box-shadow: 0 0 0 1px #db7093, 0 12px 28px rgba(219, 112, 147, 0.18);
      }

      .profile-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .profile-text {
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 7vw, 3.5rem);
        line-height: 1.1;
      }

      .lead {
        margin: 0;
        color: #db7093;
        font-size: 1.05rem;
        line-height: 1.8;
      }

      .details {
        display: grid;
        gap: 18px;
        margin-top: 36px;
      }

      section {
        border-top: 1px solid rgba(219, 112, 147, 0.35);
        padding-top: 18px;
      }

      h2 {
        margin: 0 0 8px;
        color: #db7093;
        font-size: 0.9rem;
        letter-spacing: 0;
      }

      p,
      ul {
        margin: 0;
        color: #db7093;
        font-size: 1.05rem;
        line-height: 1.8;
      }

      ul {
        padding-left: 1.2em;
      }

    </style>
  </head>
  <body>
    <main>
      <div class="profile">
        <div class="profile-image" aria-label="プロフィール画像">
          <img
            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160'%3E%3Crect width='160' height='160' fill='%23e8f1f8'/%3E%3Ccircle cx='80' cy='64' r='30' fill='%239fb3c8'/%3E%3Cpath d='M34 138c7-31 27-48 46-48s39 17 46 48' fill='%23627386'/%3E%3C/svg%3E"
            alt="プロフィール画像"
          >
        </div>

        <div class="profile-text">
          <h1>あなたの名前</h1>
          <p class="lead">ここに短い自己紹介を書きます。</p>
        </div>
      </div>

      <div class="details">
        <section>
          <h2>好きなもの</h2>
          <ul>
            <li>好きなもの 1</li>
            <li>好きなもの 2</li>
            <li>好きなもの 3</li>
          </ul>
        </section>

        <section>
          <h2>一言コメント</h2>
          <p>よろしくお願いします。</p>
        </section>
      </div>
    </main>
  </body>
</html>
