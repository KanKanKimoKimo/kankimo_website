<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自己紹介 | Kankimo Website</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #db7093;
        background: #ffc0cb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      main {
        width: min(100%, 760px);
        background: #ffe4e1;
        border: 2px solid #db7093;
        border-radius: 24px;
        box-shadow: 0 16px 40px rgba(219, 112, 147, 0.18);
        padding: clamp(28px, 6vw, 56px);
      }

      .profile {
        display: grid;
        gap: 28px;
        align-items: center;
        text-align: center;
      }

      .profile-image {
        width: min(220px, 72vw);
        height: auto;
        display: block;
        justify-self: center;
        background: transparent;
      }

      .profile-text {
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1rem, 3.5vw, 1.75rem);
        line-height: 1.1;
      }

      .lead {
        margin: 0;
        color: #db7093;
        font-size: 1.092rem;
        line-height: 1.8;
      }

      .details {
        display: grid;
        gap: 18px;
        margin-top: 36px;
      }

      section {
        border-top: 1px solid rgba(219, 112, 147, 0.35);
        padding-top: 18px;
        text-align: center;
      }

      h2 {
        margin: 0 0 8px;
        color: #db7093;
        font-size: 1.17rem;
        letter-spacing: 0;
      }

      p,
      ul {
        margin: 0;
        color: #db7093;
        font-size: 1.092rem;
        line-height: 1.8;
      }

      ul {
        display: inline-block;
        padding-left: 1.2em;
        text-align: left;
      }

    </style>
  </head>
  <body>
    <main>
      <div class="profile">
        <img
          class="profile-image"
          src="assets/profile.png"
          alt="かんきものプロフィール画像"
        >

        <div class="profile-text">
          <h1>かんきも</h1>
          <p class="lead">18歳</p>
        </div>
      </div>

      <div class="details">
        <section>
          <h2>誕生日</h2>
          <p>2007/10/10</p>
        </section>

        <section>
          <h2>好きなもの</h2>
          <ul>
            <li>ちいかわ</li>
            <li>中華</li>
            <li>家族</li>
          </ul>
        </section>

        <section>
          <h2>一言コメント</h2>
          <p>やほー！！！</p>
        </section>
      </div>
    </main>
  </body>
</html>
