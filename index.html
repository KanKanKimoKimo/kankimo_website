<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自己紹介 | Kankimo Website</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #db7093;
        background: #ffc0cb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        overflow-x: hidden;
      }

      main {
        position: relative;
        z-index: 1;
        width: min(100%, 760px);
        background: #ffe4e1;
        border: 2px solid #db7093;
        border-radius: 24px;
        box-shadow: 0 16px 40px rgba(219, 112, 147, 0.18);
        padding: clamp(28px, 6vw, 56px);
        animation: card-pop 720ms cubic-bezier(0.2, 0.9, 0.25, 1.25) both;
      }

      .pop-animation {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .bubble,
      .heart {
        position: absolute;
        display: block;
        opacity: 0;
      }

      .bubble {
        width: var(--size);
        aspect-ratio: 1;
        left: var(--left);
        top: var(--top);
        border: 2px solid rgba(219, 112, 147, 0.46);
        border-radius: 50%;
        background: rgba(255, 228, 225, 0.5);
        animation: float-pop var(--duration) ease-out var(--delay) both;
      }

      .heart {
        left: var(--left);
        top: var(--top);
        color: #db7093;
        font-size: var(--size);
        line-height: 1;
        transform-origin: center;
        animation: heart-bounce var(--duration) ease-out var(--delay) both;
      }

      .profile {
        display: grid;
        gap: 28px;
        align-items: center;
        text-align: center;
      }

      .profile-image {
        width: min(220px, 72vw);
        height: auto;
        display: block;
        justify-self: center;
        background: transparent;
        animation: image-bounce 900ms cubic-bezier(0.2, 0.9, 0.25, 1.25) 180ms both;
      }

      .profile-text {
        text-align: center;
        animation: fade-slide 560ms ease-out 520ms both;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1rem, 3.5vw, 1.75rem);
        line-height: 1.1;
      }

      .lead {
        margin: 0;
        color: #db7093;
        font-size: 1.092rem;
        line-height: 1.8;
      }

      .details {
        display: grid;
        gap: 18px;
        margin-top: 36px;
      }

      section {
        border-top: 1px solid rgba(219, 112, 147, 0.35);
        padding-top: 18px;
        text-align: center;
        animation: fade-slide 520ms ease-out both;
      }

      section:nth-child(1) {
        animation-delay: 700ms;
      }

      section:nth-child(2) {
        animation-delay: 860ms;
      }

      section:nth-child(3) {
        animation-delay: 1020ms;
      }

      h2 {
        margin: 0 0 8px;
        color: #db7093;
        font-size: 1.17rem;
        letter-spacing: 0;
      }

      p,
      ul {
        margin: 0;
        color: #db7093;
        font-size: 1.092rem;
        line-height: 1.8;
      }

      ul {
        display: inline-block;
        padding-left: 1.2em;
        text-align: left;
      }

      @keyframes card-pop {
        from {
          opacity: 0;
          transform: translateY(22px) scale(0.92) rotate(-1deg);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1) rotate(0);
        }
      }

      @keyframes image-bounce {
        0% {
          opacity: 0;
          transform: translateY(-24px) scale(0.82) rotate(4deg);
        }

        62% {
          opacity: 1;
          transform: translateY(4px) scale(1.04) rotate(-2deg);
        }

        100% {
          opacity: 1;
          transform: translateY(0) scale(1) rotate(0);
        }
      }

      @keyframes fade-slide {
        from {
          opacity: 0;
          transform: translateY(16px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes float-pop {
        0% {
          opacity: 0;
          transform: translateY(24px) scale(0.3);
        }

        30% {
          opacity: 0.85;
        }

        100% {
          opacity: 0;
          transform: translateY(-90px) scale(1.25);
        }
      }

      @keyframes heart-bounce {
        0% {
          opacity: 0;
          transform: translateY(26px) scale(0.2) rotate(-18deg);
        }

        35% {
          opacity: 0.9;
          transform: translateY(0) scale(1.2) rotate(8deg);
        }

        100% {
          opacity: 0;
          transform: translateY(-86px) scale(0.9) rotate(24deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }

    </style>
  </head>
  <body>
    <div class="pop-animation" aria-hidden="true">
      <span class="bubble" style="--left: 8%; --top: 76%; --size: 38px; --duration: 1.7s; --delay: 80ms;"></span>
      <span class="bubble" style="--left: 18%; --top: 24%; --size: 24px; --duration: 1.45s; --delay: 380ms;"></span>
      <span class="bubble" style="--left: 78%; --top: 72%; --size: 42px; --duration: 1.75s; --delay: 180ms;"></span>
      <span class="bubble" style="--left: 88%; --top: 30%; --size: 28px; --duration: 1.5s; --delay: 560ms;"></span>
      <span class="heart" style="--left: 13%; --top: 56%; --size: 28px; --duration: 1.8s; --delay: 220ms;">♥</span>
      <span class="heart" style="--left: 82%; --top: 50%; --size: 34px; --duration: 1.9s; --delay: 420ms;">♥</span>
      <span class="heart" style="--left: 46%; --top: 82%; --size: 24px; --duration: 1.55s; --delay: 620ms;">♥</span>
    </div>

    <main>
      <div class="profile">
        <img
          class="profile-image"
          src="assets/profile.png"
          alt="かのこのプロフィール画像"
        >

        <div class="profile-text">
          <h1>かのこ</h1>
          <p class="lead">18歳</p>
        </div>
      </div>

      <div class="details">
        <section>
          <h2>誕生日</h2>
          <p>2007/10/10</p>
        </section>

        <section>
          <h2>好きなもの</h2>
          <ul>
            <li>ちいかわ</li>
            <li>中華</li>
            <li>家族</li>
          </ul>
        </section>

        <section>
          <h2>一言コメント</h2>
          <p>やほー！！！</p>
        </section>
      </div>
    </main>
  </body>
</html>
